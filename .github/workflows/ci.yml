name: security-gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-security-gate:
    name: Deterministic Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECURITY_PROFILE: hardened
      LAB_FAKE_SECRET: CYR-DEMO-KEY-FAKE-7F4C2A
      LOG_RAW_CONTENT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-rag.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-rag.txt

      - name: Run Cyranta security gate
        run: bash scripts/security_gate.sh